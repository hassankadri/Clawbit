name: Offline engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend and deterministic evaluations
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      PYTHON_DOTENV_DISABLED: "1"
      CLAWBIT_RUNTIME_DIR: ${{ github.workspace }}/.clawbit-offline
      GOOGLE_API_KEY: test-google-key
      GROQ_API_KEY: test-groq-key
      OPENROUTER_API_KEY: test-openrouter-key
      TAVILY_API_KEY: test-tavily-key
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      CLAWBIT_LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-lock.txt
      - name: Install the pinned environment
        run: python -m pip install -r requirements-dev.txt -r requirements-lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile application and test sources without importing stores
        run: python -c "from pathlib import Path; import py_compile; paths = list(Path('.').glob('*.py')) + list(Path('tests').rglob('*.py')); [py_compile.compile(str(p), doraise=True) for p in paths]; print(f'{len(paths)} files compiled')"
      - name: Full offline backend suite
        run: python -m pytest tests -q -W error::RuntimeWarning --tb=short -o faulthandler_timeout=90 -o junit_family=legacy --junitxml=.pytest_cache/backend.xml
      - name: Offline evaluations
        if: ${{ !cancelled() }}
        run: python evaluate.py --category all --output evaluation-results
      - name: Retain evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-evaluations
          path: backend/evaluation-results/
          retention-days: 7
          if-no-files-found: error

  frontend-checks:
    name: Frontend tests, types, lint and build
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
